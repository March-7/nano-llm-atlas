<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f2f3f2" />
    <meta
      name="description"
      content="逐格探索语言模型的三维计算图。查看 NanoGPT 真实权重和激活，以及 GPT-2、GPT-3、Llama 3.1 和 Qwen3.8 的张量结构。"
    />
    <title>Tensor Atlas · 三维计算图</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css?v=3" />
    <link rel="stylesheet" href="./src/detail/view.css?v=3" />
    <link rel="stylesheet" href="./src/detail/reader.css?v=3.1" />
    <script type="module" src="./src/app.js?v=3.1"></script>
  </head>
  <body>
    <a class="skip" href="#scene" data-t="skip">跳到计算图</a>
    <header class="studio-header">
      <a href="./" class="brand" aria-label="Tensor Atlas"
        ><img src="./assets/mark.svg" width="29" height="29" alt="" />Tensor <b>Atlas</b></a
      >
      <nav class="studio-nav">
        <a href="#chapters" data-t="reader">章节导览</a>
        <a href="#lab" id="lab-link" data-t="experiment">数值实验</a>
        <a href="#references" data-t="references">参考资料</a>
      </nav>
      <div class="header-actions">
        <button
          type="button"
          class="quiet-button reader-toggle"
          id="reader-toggle"
          aria-controls="reader"
          aria-expanded="false"
        >
          <i data-icon="book"></i><span data-t="readerShort">导览</span>
        </button>
        <button id="show-guide" class="quiet-button" type="button">
          <i data-icon="compass"></i><span data-t="guide">操作指南</span>
        </button>
        <button id="language" class="quiet-button" type="button">
          <i data-icon="globe"></i><span>EN</span>
        </button>
        <a
          href="https://github.com/March-7/nano-llm-atlas"
          class="quiet-button"
          aria-label="GitHub"
          target="_blank"
          rel="noopener noreferrer"
          ><i data-icon="github"></i
        ></a>
      </div>
    </header>
    <main id="workspace" class="workspace">
      <h1 class="sr-only" data-t="title">语言模型三维计算图</h1>
      <aside class="reader" id="reader" aria-labelledby="reader-model">
        <header class="reader-head">
          <button type="button" id="chapter-prev" class="reader-arrow" data-tip="previous">
            <i data-icon="left"></i>
          </button>
          <div class="reader-location">
            <span data-t="chapter">章节</span><b id="chapter-location">总览</b>
          </div>
          <button type="button" id="chapter-next" class="reader-arrow" data-tip="next">
            <i data-icon="right"></i>
          </button>
          <button type="button" id="reader-close" class="reader-arrow reader-close" data-tip="close">
            <i data-icon="close"></i>
          </button>
        </header>
        <div id="reader-scroll" class="reader-scroll">
          <section id="chapters" class="reader-section course">
            <header class="course-intro">
              <h2 id="reader-model">NanoGPT</h2>
              <p id="reader-lead"></p>
            </header>
            <div class="contents">
              <div id="chapter-map" class="chapter-map"></div>
              <nav class="course-nav" aria-labelledby="contents-title">
                <h3 id="contents-title" data-t="contents">章节目录</h3>
                <button id="model-intro" class="toc-intro" type="button" data-t="modelOverview">
                  结构概览
                </button>
                <div id="stage-list" class="chapter-list"></div>
              </nav>
            </div>
            <article id="lesson-reading" class="lesson-reading">
              <h3 id="lesson-heading"></h3>
              <p id="stage-description"></p>
              <code id="lesson-formula" hidden></code>
            </article>
          </section>
          <section class="panel picked-panel" id="picked-panel" hidden>
            <div class="path-top">
              <h2><i data-icon="scan"></i><span data-t="picked">选中的单元</span></h2>
              <button id="return-cell" type="button" class="play-button" data-t="returnCell">
                回到这一格
              </button>
            </div>
            <div id="picked" aria-live="polite"></div>
          </section>
          <section class="lab panel" id="lab" aria-labelledby="lab-heading"></section>
          <div id="references" class="detail-grid">
            <section class="panel fact-sheet">
              <h2><i data-icon="sliders"></i><span data-t="specs">模型规格</span></h2>
              <dl id="facts" class="facts"></dl>
              <p id="scope" class="scope"></p>
            </section>
            <section class="panel reading">
              <h2><i data-icon="book"></i><span data-t="reading">二维图谱与来源</span></h2>
              <div id="reading"></div>
            </section>
          </div>
          <footer class="reader-credit">
            <span class="foot-brand"
              ><img src="./assets/mark.svg" width="20" height="20" alt="" />Tensor Atlas</span
            >
            <span
              ><span data-t="credit">经典模型布局改编自</span>
              <a href="https://github.com/bbycroft/llm-viz" rel="noopener noreferrer" target="_blank"
                >Brendan Bycroft · llm-viz ↗</a
              ></span
            >
          </footer>
        </div>
        <footer class="reader-footer">
          <progress id="chapter-progress" value="0" max="8" aria-label="章节进度"></progress>
          <button id="play" type="button" class="play-button"></button>
          <button id="continue" class="continue" type="button">
            <span id="continue-text"></span><i data-icon="arrow"></i>
          </button>
        </footer>
      </aside>
      <section id="explorer" aria-labelledby="view-model">
        <div id="viewer" class="diagram">
          <canvas id="scene" tabindex="0" aria-label="可交互的三维张量图"></canvas>
          <div id="world-labels" class="world-labels" role="group" aria-label="同场模型"></div>
          <div class="diagram-toolbar">
            <div id="model-list" class="diagram-tabs" role="group" aria-label="选择模型"></div>
            <div class="diagram-tools">
              <button id="fit" type="button" data-tip="fit">
                <i data-icon="expand"></i><span data-t="fitShort">全览</span>
              </button>
              <button id="detail" type="button" data-tip="detail">
                <i data-icon="scan"></i><span data-t="detailShort">局部</span>
              </button>
              <button id="cell-zoom" type="button" data-tip="cellZoom">
                <i data-icon="plus"></i><span data-t="cellShort">单格</span>
              </button>
              <button id="locate" type="button" aria-expanded="false" aria-controls="locator">
                <i data-icon="sliders"></i><span data-t="locate">定位张量</span>
              </button>
              <button id="labels" type="button" aria-pressed="true" data-tip="labels">
                <i data-icon="tag"></i>
              </button>
              <button id="rotate" type="button" aria-pressed="false" data-tip="rotate">
                <i data-icon="orbit"></i>
              </button>
            </div>
          </div>
          <form id="locator" class="locator" hidden>
            <div class="locator-head">
              <b data-t="locate">定位张量</b
              ><button type="button" id="locator-close" data-tip="close"><i data-icon="close"></i></button>
            </div>
            <div class="locator-pair">
              <label
                ><span data-t="layer">解码层</span
                ><select id="layer"></select
              ></label>
              <label
                ><span data-t="head">注意力头</span
                ><select id="head"></select
              ></label>
            </div>
            <label
              ><span data-t="tensor">张量</span
              ><select id="tensor"></select
            ></label>
            <div class="locator-pair">
              <label
                ><span id="axis-x">x</span
                ><input id="coord-x" type="number" value="0" step="1" min="0" required
              /></label>
              <label
                ><span id="axis-y">y</span
                ><input id="coord-y" type="number" value="0" step="1" min="0" required
              /></label>
              <label id="coord-z-field" hidden
                ><span id="axis-z">z</span><input id="coord-z" type="number" value="0" step="1" min="0"
              /></label>
            </div>
            <button class="apply-location" type="submit">
              <i data-icon="scan"></i><span data-t="goCell">定位到该单元</span>
            </button>
          </form>
          <svg id="callout-line" width="100%" height="100%" aria-hidden="true" hidden>
            <path id="callout-path" fill="none" stroke-width="1" />
            <circle id="callout-dot" r="2" />
          </svg>
          <div id="cell-tip" class="cell-tip" role="tooltip" hidden></div>
          <div class="stage-legend" id="legend">
            <span><b class="swatch weight"></b><span data-t="weights">权重</span></span>
            <span><b class="swatch active"></b><span data-t="activations">激活</span></span>
            <span><b class="swatch aggregate"></b><span data-t="aggregates">统计量</span></span>
          </div>
          <div class="zoom-tools">
            <button id="zoom-out" type="button" data-tip="zoomOut"><i data-icon="minus"></i></button>
            <output id="zoom" aria-label="缩放">1×</output>
            <button id="zoom-in" type="button" data-tip="zoomIn"><i data-icon="plus"></i></button>
            <button id="expand" type="button" data-tip="expand"><i data-icon="expand"></i></button>
          </div>
        </div>
        <div class="diagram-caption">
          <div><strong id="view-model">NanoGPT</strong><span id="view-stats"></span></div>
          <span id="value-source"></span>
          <a id="gallery-short" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </section>
    </main>
    <dialog id="guide-dialog" aria-labelledby="guide-heading">
      <div class="dialog-head">
        <h2 id="guide-heading" data-t="guide">操作指南</h2>
        <button type="button" id="close-guide" class="square-button" data-tip="close">
          <i data-icon="close"></i>
        </button>
      </div>
      <div id="guide-body"></div>
    </dialog>
    <noscript
      >请启用 JavaScript 查看交互式张量。Enable JavaScript to inspect individual tensor cells.</noscript
    >
  </body>
</html>
